version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: galaxy-bay-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: db_admin
      POSTGRES_PASSWORD: galaxy_bay_2025
      POSTGRES_DB: galaxy_bay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_admin -d galaxy_bay"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
